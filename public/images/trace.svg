<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#e8edf3" stroke="none"/><rect x="100" y="130" width="1000" height="640" rx="14" fill="#1c2432" stroke="none"/><rect x="100" y="130" width="1000" height="56" rx="14" fill="#252f40" stroke="none"/><text x="130" y="166" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#8e9cae">●  ●  ●</text><text x="490" y="166" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#bac7d8">trace / pipeline inspector</text><text x="145" y="245" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#e0e9f6">$ trace inspect ./sample.json</text><text x="145" y="286" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#9eb0c7">ILLUSTRATIVE OUTPUT · NO LIVE PROCESS</text><rect x="145" y="330" width="280" height="120" rx="8" fill="#252f40" stroke="#46576d"/><text x="167" y="364" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#abbcd2">01 / SOURCE</text><text x="167" y="408" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e1eaf5">sample.json</text><rect x="455" y="330" width="280" height="120" rx="8" fill="#243b57" stroke="#46576d"/><text x="477" y="364" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#abbcd2">02 / TRANSFORM</text><text x="477" y="408" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e1eaf5">normalize()</text><rect x="765" y="330" width="280" height="120" rx="8" fill="#252f40" stroke="#46576d"/><text x="787" y="364" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#abbcd2">03 / OUTPUT</text><text x="787" y="408" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e1eaf5">result.json</text><text x="145" y="512" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#aacdbb">✓  Source loaded</text><text x="145" y="554" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#aacdbb">✓  Fields normalized</text><text x="145" y="596" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#c5d4e9">→  Inspect changes at each step</text><rect x="145" y="642" width="900" height="66" rx="6" fill="#18202d" stroke="none"/><text x="165" y="681" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#b3c6df">input → transformation → output</text></svg>